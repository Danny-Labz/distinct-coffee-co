<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order — Distinct. Coffee Co.</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0a0a0a;
      --white: #f8f6f2;
      --off-white: #eeebe5;
      --mid: #c8c3bb;
      --border: rgba(10,10,10,0.1);
    }
    body {
      background: var(--white);
      color: var(--black);
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      background: rgba(248, 246, 242, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-back {
      font-size: 9px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; color: var(--black);
      text-decoration: none; opacity: 0.5; transition: opacity 0.2s;
    }
    .nav-back:hover { opacity: 1; }
    .nav-title {
      font-size: 9px; font-weight: 700; letter-spacing: 3px;
      text-transform: uppercase; color: var(--mid);
    }

    /* STICKY TOTAL BAR */
    .sticky-total-bar {
      position: fixed;
      top: 58px; left: 0; right: 0;
      z-index: 99;
      background: var(--black);
      color: var(--white);
      padding: 14px 24px;
      display: none;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .sticky-total-bar.visible { display: flex; }
    .sticky-total-bar:active { transform: scale(0.98); }
    .sticky-total-left { display: flex; align-items: center; gap: 10px; }
    .sticky-total-count {
      background: rgba(248,246,242,0.15);
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
    }
    .sticky-total-label { font-size: 12px; font-weight: 500; letter-spacing: 0.3px; }
    .sticky-total-amount { font-size: 17px; font-weight: 700; }
    .sticky-total-arrow { font-size: 12px; opacity: 0.5; margin-left: 8px; }

    /* MAIN */
    main { max-width: 640px; margin: 0 auto; padding: 148px 24px 100px; }

    /* SECTION LABEL */
    .section-label {
      font-size: 10px; font-weight: 700; letter-spacing: 2.5px;
      text-transform: uppercase; color: var(--mid);
      margin-bottom: 16px; padding-bottom: 10px;
      border-bottom: 1px solid var(--off-white);
    }

    /* MENU */
    .menu-section { margin-bottom: 36px; }
    .menu-item {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 18px 0; border-bottom: 1px solid var(--off-white);
      gap: 14px;
    }
    .menu-item:last-child { border-bottom: none; }
    .item-name { font-size: 17px; font-weight: 500; line-height: 1.3; }
    .item-desc { font-size: 12px; color: var(--mid); margin-top: 3px; }
    .item-price { font-size: 15px; font-weight: 600; min-width: 54px; text-align: right; }

    /* ADD BUTTON — replaces the old qty stepper; each tap adds ONE configurable drink */
    .add-drink-btn {
      width: 44px; height: 44px; background: var(--black); color: var(--white);
      border: none; border-radius: 4px; font-size: 22px; font-weight: 400;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.15s;
    }
    .add-drink-btn:active { background: #333; }
    .item-drink-count {
      font-size: 11px; font-weight: 700; color: var(--black);
      background: var(--off-white); border-radius: 20px; padding: 4px 10px;
      margin-right: 8px; white-space: nowrap;
    }

    /* ── YOUR DRINKS (configured cart) ── */
    #your-drinks-section { display: none; }
    .drink-card {
      background: var(--off-white);
      border-radius: 6px;
      padding: 18px 20px;
      margin-bottom: 12px;
    }
    .drink-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; gap: 10px;
    }
    .drink-name-input {
      font-size: 16px; font-weight: 600; color: var(--black);
      background: none; border: none; border-bottom: 1.5px dashed var(--mid);
      padding: 4px 2px; outline: none; flex: 1; min-width: 0;
      font-family: 'Montserrat', sans-serif;
    }
    .drink-name-input:focus { border-bottom-color: var(--black); }
    .drink-card-price { font-size: 15px; font-weight: 700; white-space: nowrap; }
    .drink-remove-btn {
      background: none; border: none; color: var(--mid); font-size: 18px;
      cursor: pointer; padding: 2px 6px; line-height: 1; flex-shrink: 0;
    }
    .drink-remove-btn:active { color: #c00; }
    .drink-item-label {
      font-size: 12px; color: #777; margin-bottom: 14px; letter-spacing: 0.2px;
    }

    .drink-config-label {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--mid); margin-bottom: 8px; margin-top: 14px;
    }
    .drink-config-label:first-of-type { margin-top: 0; }
    .drink-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .drink-chip {
      font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
      padding: 9px 14px; border-radius: 20px;
      border: 1.5px solid var(--border); background: var(--white);
      cursor: pointer; color: var(--black);
      font-family: 'Montserrat', sans-serif;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .drink-chip.active { background: var(--black); color: var(--white); border-color: var(--black); }

    /* CHIPS (legacy — still used for milk/addon loading state text) */
    .chips { display: flex; gap: 10px; flex-wrap: wrap; }

    /* FORM */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 10px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--mid); margin-bottom: 8px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%; background: var(--off-white);
      border: 1.5px solid transparent; border-radius: 4px;
      padding: 15px 16px; font-family: 'Montserrat', sans-serif;
      font-size: 16px; font-weight: 400; color: var(--black);
      outline: none; transition: border-color 0.2s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--black); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* SUMMARY */
    .summary-box {
      background: var(--off-white); padding: 22px 24px;
      border-radius: 4px; margin-bottom: 20px;
    }
    .summary-row {
      display: flex; justify-content: space-between;
      font-size: 14px; padding: 7px 0; color: #444;
    }
    .summary-row.total {
      font-size: 19px; font-weight: 700; color: var(--black);
      border-top: 1.5px solid rgba(10,10,10,0.12);
      margin-top: 10px; padding-top: 14px;
    }
    .summary-empty { font-size: 13px; color: var(--mid); text-align: center; padding: 10px 0; }

    /* PAYMENT OPTIONS */
    .payment-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
    .payment-opt {
      background: var(--off-white); border: 2px solid transparent;
      border-radius: 4px; padding: 18px 16px; text-align: left;
      cursor: pointer; transition: border-color 0.2s, background 0.2s;
      font-family: 'Montserrat', sans-serif;
    }
    .payment-opt.active { border-color: var(--black); background: var(--white); }
    .payment-opt-title { font-size: 14px; font-weight: 700; margin-bottom: 5px; }
    .payment-opt-desc { font-size: 11.5px; color: #777; line-height: 1.6; font-weight: 400; }

    /* SUBMIT */
    .btn-submit {
      width: 100%; background: var(--black); color: var(--white);
      border: none; padding: 20px; font-family: 'Montserrat', sans-serif;
      font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; cursor: pointer; border-radius: 4px;
      transition: background 0.2s;
    }
    .btn-submit:hover:not(:disabled) { background: #222; }
    .btn-submit:disabled { opacity: 0.35; cursor: not-allowed; }
    .secure-note { text-align: center; font-size: 11px; color: var(--mid); margin-top: 12px; letter-spacing: 0.3px; }

    /* MESSAGES */
    .msg {
      display: none; padding: 12px 16px; border-radius: 2px;
      font-size: 11px; margin-bottom: 14px; line-height: 1.6;
    }
    .msg-error { background: #fff0f0; border: 1px solid #ffcccc; color: #cc0000; }
    .msg-loading { background: var(--off-white); color: var(--mid); text-align: center; letter-spacing: 1px; }

    /* LOADING SPINNER */
    .menu-loading {
      text-align: center; padding: 32px; font-size: 10px;
      color: var(--mid); letter-spacing: 2px; text-transform: uppercase;
    }

    @media (max-width: 500px) {
      nav { padding: 16px 20px; }
      main { padding: 148px 16px 80px; }
      .form-row { grid-template-columns: 1fr; }
      .payment-options { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-back">← Back</a>
  <span class="nav-title">Place an Order</span>
</nav>

<div class="sticky-total-bar" id="sticky-total-bar" onclick="scrollToSummary()">
  <div class="sticky-total-left">
    <div class="sticky-total-count" id="sticky-total-count">0</div>
    <div class="sticky-total-label">drinks · tap to review</div>
  </div>
  <div class="sticky-total-left">
    <div class="sticky-total-amount" id="sticky-total-amount">$0.00</div>
    <span class="sticky-total-arrow">↓</span>
  </div>
</div>

<main>

  <!-- MENU -->
  <div id="menu-container">
    <div class="menu-loading">Loading menu...</div>
  </div>

  <!-- YOUR DRINKS — each configured individually -->
  <div id="your-drinks-section">
    <div class="section-label" style="margin-top:8px;">Your Drinks</div>
    <div id="your-drinks-list"></div>
  </div>

  <!-- EVENT / DATE -->
  <div id="event-section" style="display:none;">
    <div id="event-banner" style="display:none;background:#0a0a0a;color:#f8f6f2;padding:20px 22px;border-radius:2px;margin-bottom:28px;">
      <div style="font-size:8px;letter-spacing:3px;text-transform:uppercase;opacity:0.4;margin-bottom:6px;">Upcoming Event</div>
      <div id="ev-name" style="font-size:18px;font-weight:200;margin-bottom:6px;">—</div>
      <div id="ev-meta" style="font-size:10px;opacity:0.5;letter-spacing:1px;"></div>
      <div id="ev-cutoff" style="font-size:9px;opacity:0.3;margin-top:6px;"></div>
    </div>

    <div class="section-label">Pickup / Service Time</div>
    <div id="pickup-slots" style="display:none;">
      <div class="form-group">
        <label class="form-label">Select pickup window</label>
        <select class="form-select" id="pickup-time">
          <option value="">Choose a time...</option>
          <option data-slot="9:00 AM – 9:15 AM">9:00 AM – 9:15 AM</option>
          <option data-slot="9:15 AM – 9:30 AM">9:15 AM – 9:30 AM</option>
          <option data-slot="9:30 AM – 9:45 AM">9:30 AM – 9:45 AM</option>
          <option data-slot="9:45 AM – 10:00 AM">9:45 AM – 10:00 AM</option>
          <option data-slot="10:00 AM – 10:15 AM">10:00 AM – 10:15 AM</option>
          <option data-slot="10:15 AM – 10:30 AM">10:15 AM – 10:30 AM</option>
          <option data-slot="10:30 AM – 10:45 AM">10:30 AM – 10:45 AM</option>
          <option data-slot="10:45 AM – 11:00 AM">10:45 AM – 11:00 AM</option>
          <option data-slot="11:00 AM – 11:15 AM">11:00 AM – 11:15 AM</option>
          <option data-slot="11:15 AM – 11:30 AM">11:15 AM – 11:30 AM</option>
          <option data-slot="11:30 AM – 11:45 AM">11:30 AM – 11:45 AM</option>
          <option data-slot="11:45 AM – 12:00 PM">11:45 AM – 12:00 PM</option>
        </select>
        <div id="slot-capacity-note" style="display:none;font-size:10px;color:#888;margin-top:8px;line-height:1.6;"></div>
      </div>
    </div>
    <div id="custom-time" style="display:none;">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Requested Date & Time</label>
          <input type="datetime-local" class="form-input" id="custom-datetime" />
        </div>
        <div class="form-group">
          <label class="form-label">Service Location</label>
          <input type="text" class="form-input" id="custom-location" placeholder="Address or venue" />
        </div>
      </div>
    </div>
  </div>

  <!-- CUSTOMER INFO -->
  <div id="customer-section" style="display:none;">
    <div class="section-label">Your Details</div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">First Name</label>
        <input type="text" class="form-input" id="first-name" placeholder="Danny" />
      </div>
      <div class="form-group">
        <label class="form-label">Last Name</label>
        <input type="text" class="form-input" id="last-name" placeholder="Smith" />
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-input" id="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label class="form-label">Phone</label>
      <input type="tel" class="form-input" id="phone" placeholder="(555) 000-0000" />
    </div>
    <div class="form-group">
      <label class="form-label">Notes (optional)</label>
      <textarea class="form-textarea" id="notes" placeholder="Special requests..."></textarea>
    </div>
  </div>

  <!-- SUMMARY -->
  <div id="summary-section" style="display:none;">
    <div class="section-label">Order Summary</div>
    <div class="summary-box">
      <div id="summary-items"><div class="summary-empty">No items yet</div></div>
      <div class="summary-row total"><span>Total</span><span id="summary-total">$0.00</span></div>
    </div>
  </div>

  <!-- PAYMENT -->
  <div id="payment-section" style="display:none;">
    <div class="section-label">Payment</div>
    <div class="payment-options">
      <button class="payment-opt active" onclick="selectPayment(this,'pay_now')">
        <div class="payment-opt-title">Pay Now</div>
        <div class="payment-opt-desc">Secure card payment via Stripe. Confirmed instantly.</div>
      </button>
      <button class="payment-opt" onclick="selectPayment(this,'pay_at_event')">
        <div class="payment-opt-title">Pay at Event</div>
        <div class="payment-opt-desc">Cash or card on the day. Order reserved immediately.</div>
      </button>
    </div>

    <div class="msg msg-error" id="error-msg"></div>
    <button class="btn-submit" id="submit-btn" onclick="submitOrder()">Proceed to Payment →</button>
    <p class="secure-note" id="secure-note">🔒 Secure checkout powered by Stripe</p>
  </div>

</main>

<script>
const SUPABASE_URL = 'https://qjsitqvfimwiuoojsoge.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqc2l0cXZmaW13aXVvb2pzb2dlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MzAwNzUsImV4cCI6MjA5ODUwNjA3NX0.p2qXO5-Z6uWd7n7slhHJT_s2NDvjRlsOMQLqCRxFIcU';

// ── STATE ────────────────────────────────────
// drinks: flat array of individually-configured drink instances.
// Each: { uid, menuItemId, name, price, category, label, milk, addons: [] }
let drinks = [];
let drinkUidCounter = 0;

let milkOptions = [];   // [{name, price_cents}]
let addonOptions = [];  // [{name, price_cents}]

let paymentMethod = 'pay_now';
let activeEvent = null;

// ── INIT ──────────────────────────────────────
window.addEventListener('load', async () => {
  await Promise.allSettled([loadMenu(), loadEvent(), loadAddons()]);
});

// ── FETCH HELPERS ─────────────────────────────
async function sbFetch(path) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
  });
  if (!r.ok) throw new Error(`${r.status}`);
  return r.json();
}

// ── LOAD MENU ──────────────────────────────────
async function loadMenu() {
  try {
    const items = await sbFetch('menu_items?is_available=eq.true&order=category.asc,sort_order.asc');
    if (!items.length) {
      document.getElementById('menu-container').innerHTML = '<p style="color:#999;font-size:12px;padding:20px 0;">Menu unavailable right now.</p>';
      return;
    }
    const cats = {};
    items.forEach(i => { if (!cats[i.category]) cats[i.category] = []; cats[i.category].push(i); });

    document.getElementById('menu-container').innerHTML = Object.entries(cats).map(([cat, catItems]) => `
      <div class="menu-section">
        <div class="section-label">${cat}</div>
        ${catItems.map(item => `
          <div class="menu-item" data-id="${item.id}" data-name="${item.name}" data-price="${item.price_cents}" data-category="${item.category}">
            <div style="flex:1;">
              <div class="item-name">${item.name}</div>
              <div class="item-desc">${item.description || ''}</div>
            </div>
            <div class="item-price">$${(item.price_cents/100).toFixed(2)}</div>
            <span class="item-drink-count" id="count-${item.id}" style="display:none;">0</span>
            <button class="add-drink-btn" onclick="addDrink('${item.id}')">+</button>
          </div>`).join('')}
      </div>`).join('');

    // Show rest of form
    ['event-section','customer-section','summary-section','payment-section']
      .forEach(id => document.getElementById(id).style.display = 'block');

  } catch(e) {
    document.getElementById('menu-container').innerHTML = `<p style="color:#c00;font-size:12px;padding:20px 0;">Could not load menu (${e.message}). Please refresh.</p>`;
  }
}

// ── LOAD ADD-ONS & MILK OPTIONS ─────────────────
async function loadAddons() {
  try {
    const items = await sbFetch('addons?is_available=eq.true&order=type.asc,sort_order.asc');
    milkOptions  = items.filter(a => a.type === 'milk');
    addonOptions = items.filter(a => a.type === 'syrup');
  } catch(e) {
    console.warn('Could not load addons:', e);
    milkOptions = [];
    addonOptions = [];
  }
}

// ── ADD A DRINK (one configurable instance per tap) ──
function addDrink(menuItemId) {
  const row = document.querySelector(`.menu-item[data-id="${menuItemId}"]`);
  if (!row) return;

  const name     = row.dataset.name;
  const price    = parseInt(row.dataset.price);
  const category = row.dataset.category || '';

  drinkUidCounter += 1;
  const drink = {
    uid: drinkUidCounter,
    menuItemId,
    name,
    price,
    category,
    label: '', // filled in after we know this item's running count
    milk: milkOptions.length ? milkOptions[0].name : '',
    addons: [],
  };
  drinks.push(drink);

  // Label defaults to "Drink N" scoped to overall order, not per-item —
  // simplest mental model for the customer ("Drink 1", "Drink 2"...)
  drink.label = `Drink ${drinks.length}`;

  updateItemCountBadge(menuItemId);
  renderYourDrinks();
  updateSummary();

  // Scroll the new drink card into view so it's obvious what just happened
  requestAnimationFrame(() => {
    const card = document.getElementById(`drink-card-${drink.uid}`);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
}

function removeDrink(uid) {
  const drink = drinks.find(d => d.uid === uid);
  if (!drink) return;
  drinks = drinks.filter(d => d.uid !== uid);

  // Renumber remaining default labels ("Drink 1", "Drink 2"...) but leave
  // any custom name the customer typed untouched.
  let n = 0;
  drinks.forEach(d => {
    n += 1;
    if (/^Drink \d+$/.test(d.label)) d.label = `Drink ${n}`;
  });

  updateItemCountBadge(drink.menuItemId);
  renderYourDrinks();
  updateSummary();
}

function updateItemCountBadge(menuItemId) {
  const count = drinks.filter(d => d.menuItemId === menuItemId).length;
  const badge = document.getElementById(`count-${menuItemId}`);
  if (!badge) return;
  badge.textContent = count;
  badge.style.display = count > 0 ? 'inline-block' : 'none';
}

// ── RENDER "YOUR DRINKS" — one card per configurable drink ──
function renderYourDrinks() {
  const section = document.getElementById('your-drinks-section');
  const list = document.getElementById('your-drinks-list');

  if (!drinks.length) {
    section.style.display = 'none';
    list.innerHTML = '';
    return;
  }
  section.style.display = 'block';

  list.innerHTML = drinks.map(d => {
    const milkChips = milkOptions.length ? `
      <div class="drink-config-label">Milk</div>
      <div class="drink-chips">
        ${milkOptions.map(m => `
          <button type="button" class="drink-chip ${d.milk === m.name ? 'active' : ''}" onclick="setDrinkMilk(${d.uid}, '${m.name.replace(/'/g,"\\'")}')">${m.name}</button>
        `).join('')}
      </div>` : '';

    const addonChips = addonOptions.length ? `
      <div class="drink-config-label">Add-ons</div>
      <div class="drink-chips">
        ${addonOptions.map(a => {
          const active = d.addons.includes(a.name);
          const priceLabel = a.price_cents ? ` +$${(a.price_cents/100).toFixed(2)}` : '';
          return `<button type="button" class="drink-chip ${active ? 'active' : ''}" onclick="toggleDrinkAddon(${d.uid}, '${a.name.replace(/'/g,"\\'")}')">${a.name}${priceLabel}</button>`;
        }).join('')}
      </div>` : '';

    return `
      <div class="drink-card" id="drink-card-${d.uid}">
        <div class="drink-card-header">
          <input type="text" class="drink-name-input" value="${d.label.replace(/"/g,'&quot;')}"
                 oninput="renameDrink(${d.uid}, this.value)" placeholder="Drink ${drinks.indexOf(d)+1}" />
          <span class="drink-card-price">$${(d.price/100).toFixed(2)}</span>
          <button class="drink-remove-btn" onclick="removeDrink(${d.uid})" aria-label="Remove drink">×</button>
        </div>
        <div class="drink-item-label">${d.name}</div>
        ${milkChips}
        ${addonChips}
      </div>`;
  }).join('');
}

function renameDrink(uid, value) {
  const d = drinks.find(x => x.uid === uid);
  if (d) d.label = value.trim() || `Drink ${drinks.indexOf(d)+1}`;
}

function setDrinkMilk(uid, milkName) {
  const d = drinks.find(x => x.uid === uid);
  if (!d) return;
  d.milk = milkName;
  renderYourDrinks();
}

function toggleDrinkAddon(uid, addonName) {
  const d = drinks.find(x => x.uid === uid);
  if (!d) return;
  if (d.addons.includes(addonName)) {
    d.addons = d.addons.filter(a => a !== addonName);
  } else {
    d.addons.push(addonName);
  }
  renderYourDrinks();
  updateSummary();
}

// ── LOAD EVENT ─────────────────────────────────
async function loadEvent() {
  try {
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get('event_id');
    const path = eventId
      ? `events?id=eq.${eventId}&limit=1`
      : `events?is_active=eq.true&order=created_at.desc&limit=1`;

    const events = await sbFetch(path);
    if (!events.length) { showCustomTime(); return; }

    activeEvent = events[0];

    if (activeEvent.order_cutoff && new Date() > new Date(activeEvent.order_cutoff)) {
      showCustomTime(); return;
    }

    document.getElementById('ev-name').textContent = activeEvent.name;
    document.getElementById('ev-meta').textContent = [activeEvent.date, activeEvent.location, activeEvent.pickup_hours].filter(Boolean).join(' · ');
    if (activeEvent.order_cutoff) {
      const c = new Date(activeEvent.order_cutoff);
      document.getElementById('ev-cutoff').textContent = `Order by ${c.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}`;
    }
    document.getElementById('event-banner').style.display = 'block';
    document.getElementById('pickup-slots').style.display = 'block';

    await applySlotCapacity(activeEvent);

  } catch(e) {
    showCustomTime();
  }
}

// ── SLOT CAPACITY ───────────────────────────────
async function applySlotCapacity(event) {
  const cap = event.max_items_per_slot;
  if (!cap || cap <= 0) return;

  try {
    const orders = await sbFetch(`orders?event_id=eq.${event.id}&status=neq.cancelled&select=pickup_time,items`);

    const slotCounts = {};
    orders.forEach(o => {
      if (!o.pickup_time || !o.items) return;
      const itemCount = countItemsInOrder(o.items);
      slotCounts[o.pickup_time] = (slotCounts[o.pickup_time] || 0) + itemCount;
    });

    const select = document.getElementById('pickup-time');
    const noteEl = document.getElementById('slot-capacity-note');
    let anyFull = false;

    Array.from(select.options).forEach(opt => {
      const slot = opt.dataset.slot;
      if (!slot) return;

      const booked = slotCounts[slot] || 0;
      const remaining = cap - booked;

      if (remaining <= 0) {
        opt.disabled = true;
        opt.textContent = `${slot} — FULL`;
        anyFull = true;
      } else {
        opt.disabled = false;
        opt.textContent = slot;
      }
    });

    if (anyFull) {
      noteEl.textContent = `We limit each pickup window to ${cap} drinks to keep wait times short — grayed-out times are full.`;
      noteEl.style.display = 'block';
    }

  } catch (e) {
    console.warn('Could not check slot capacity:', e);
  }
}

// Counts total drinks in an order.items structure, supporting both the
// legacy {menuItemId: {qty}} format and the new {menuItemId: [drink, ...]} format
function countItemsInOrder(items) {
  return Object.values(items).reduce((sum, val) => {
    if (Array.isArray(val)) return sum + val.length;
    return sum + (val.qty || 0);
  }, 0);
}

function showCustomTime() {
  document.getElementById('custom-time').style.display = 'block';
}

// ── SUMMARY ────────────────────────────────────
function updateSummary() {
  const container = document.getElementById('summary-items');
  const totalEl = document.getElementById('summary-total');
  const btn = document.getElementById('submit-btn');
  const stickyBar = document.getElementById('sticky-total-bar');
  const stickyCount = document.getElementById('sticky-total-count');
  const stickyAmount = document.getElementById('sticky-total-amount');

  if (!drinks.length) {
    container.innerHTML = '<div class="summary-empty">No drinks yet</div>';
    totalEl.textContent = '$0.00';
    btn.disabled = true;
    stickyBar.classList.remove('visible');
    return;
  }

  let total = 0;
  const rows = drinks.map(d => {
    let lineTotal = d.price;
    let addonsCost = 0;
    d.addons.forEach(addonName => {
      const opt = addonOptions.find(a => a.name === addonName);
      if (opt) addonsCost += opt.price_cents;
    });
    lineTotal += addonsCost;
    total += lineTotal;

    const extras = [d.milk, ...d.addons].filter(Boolean).join(', ');
    return `<div class="summary-row">
      <span>${d.label} — ${d.name}${extras ? ` <span style="color:#999;">(${extras})</span>` : ''}</span>
      <span>$${(lineTotal/100).toFixed(2)}</span>
    </div>`;
  });

  container.innerHTML = rows.join('');
  totalEl.textContent = `$${(total/100).toFixed(2)}`;
  btn.disabled = false;

  stickyCount.textContent = drinks.length;
  stickyAmount.textContent = `$${(total/100).toFixed(2)}`;
  stickyBar.classList.add('visible');
}

function scrollToSummary() {
  const el = document.getElementById('summary-section');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── PAYMENT ────────────────────────────────────
function selectPayment(btn, method) {
  document.querySelectorAll('.payment-opt').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  paymentMethod = method;
  const submitBtn = document.getElementById('submit-btn');
  const note = document.getElementById('secure-note');
  if (method === 'pay_at_event') {
    submitBtn.textContent = 'Reserve My Order →';
    note.textContent = '✓ No payment now — pay cash or card at the event.';
  } else {
    submitBtn.textContent = 'Proceed to Payment →';
    note.textContent = '🔒 Secure checkout powered by Stripe';
  }
}

// ── VALIDATE ───────────────────────────────────
function validate() {
  const errors = [];
  if (!drinks.length) errors.push('Please add at least one drink.');
  if (!document.getElementById('first-name').value.trim()) errors.push('First name required.');
  if (!document.getElementById('email').value.trim()) errors.push('Email required.');

  const hasEvent = activeEvent && document.getElementById('pickup-slots').style.display !== 'none';
  if (hasEvent && !document.getElementById('pickup-time').value) errors.push('Please select a pickup time.');
  if (!hasEvent && !document.getElementById('custom-datetime').value) errors.push('Please select a date and time.');
  return errors;
}

// ── BUILD items PAYLOAD ────────────────────────
// Groups the flat `drinks` array back into { menuItemId: [drink, drink...] }
// so Reports / Costs / Prep View can key off menu_item_id exactly like before,
// while still preserving each individual drink's own name/milk/addons.
function buildItemsPayload() {
  const grouped = {};
  drinks.forEach(d => {
    if (!grouped[d.menuItemId]) grouped[d.menuItemId] = [];
    grouped[d.menuItemId].push({
      name: d.name,
      price: d.price,
      label: d.label,
      milk: d.milk,
      addons: d.addons,
    });
  });
  return grouped;
}

function calcTotalCents() {
  return drinks.reduce((sum, d) => {
    let line = d.price;
    d.addons.forEach(addonName => {
      const opt = addonOptions.find(a => a.name === addonName);
      if (opt) line += opt.price_cents;
    });
    return sum + line;
  }, 0);
}

// ── SUBMIT ─────────────────────────────────────
async function submitOrder() {
  const errorEl = document.getElementById('error-msg');
  const btn = document.getElementById('submit-btn');
  errorEl.style.display = 'none';

  const errors = validate();
  if (errors.length) {
    errorEl.textContent = errors.join(' ');
    errorEl.style.display = 'block';
    errorEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Saving order...';

  const hasEvent = activeEvent && document.getElementById('pickup-slots').style.display !== 'none';
  const pickupTime = hasEvent
    ? document.getElementById('pickup-time').value
    : document.getElementById('custom-datetime').value;

  if (hasEvent && activeEvent.max_items_per_slot) {
    const cartItemCount = drinks.length;
    try {
      const orders = await sbFetch(`orders?event_id=eq.${activeEvent.id}&status=neq.cancelled&pickup_time=eq.${encodeURIComponent(pickupTime)}&select=items`);
      const alreadyBooked = orders.reduce((sum, o) => {
        if (!o.items) return sum;
        return sum + countItemsInOrder(o.items);
      }, 0);

      if (alreadyBooked + cartItemCount > activeEvent.max_items_per_slot) {
        errorEl.textContent = `That pickup window just filled up. Please choose a different time.`;
        errorEl.style.display = 'block';
        errorEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        await applySlotCapacity(activeEvent);
        btn.disabled = false;
        btn.textContent = paymentMethod === 'pay_at_event' ? 'Reserve My Order →' : 'Proceed to Payment →';
        return;
      }
    } catch(e) {
      console.warn('Slot re-check failed, proceeding anyway:', e);
    }
  }

  const location = hasEvent ? (activeEvent.location || '') : (document.getElementById('custom-location').value.trim());
  const totalCents = calcTotalCents();
  const pin = String((parseInt(crypto.randomUUID().replace(/-/g,'').slice(0,8), 16) % 9000) + 1000);

  // Overall milk/temp summary lines (kept for backward-compat display in admin/emails)
  const uniqueMilks = [...new Set(drinks.map(d => d.milk).filter(Boolean))];
  const milkSummary = uniqueMilks.length > 1 ? 'Mixed' : (uniqueMilks[0] || '—');

  const hasHot  = drinks.some(d => (d.category || '').toLowerCase().includes('espresso'));
  const hasCold = drinks.some(d => (d.category || '').toLowerCase().includes('cold'));
  const tempSummary = hasHot && hasCold ? 'Mixed (Hot & Iced)' : hasCold ? 'Iced' : hasHot ? 'Hot' : '—';

  const allAddonsFlat = [...new Set(drinks.flatMap(d => d.addons))];

  const orderData = {
    event_id:       hasEvent ? activeEvent.id : '00000000-0000-0000-0000-000000000000',
    event_name:     hasEvent ? activeEvent.name : 'Custom Order',
    event_date:     hasEvent ? activeEvent.date : pickupTime,
    customer_name:  `${document.getElementById('first-name').value.trim()} ${document.getElementById('last-name').value.trim()}`.trim(),
    email:          document.getElementById('email').value.trim(),
    phone:          document.getElementById('phone').value.trim(),
    pickup_time:    pickupTime,
    milk_pref:      milkSummary,
    temp_pref:      tempSummary,
    addons:         allAddonsFlat,
    items:          buildItemsPayload(),
    total_cents:    totalCents,
    status:         paymentMethod === 'pay_at_event' ? 'reserved' : 'pending',
    payment_method: paymentMethod,
    pickup_pin:     pin,
    notes:          `${location ? 'Location: '+location+' | ' : ''}${document.getElementById('notes').value.trim()}`,
  };

  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'return=representation',
      },
      body: JSON.stringify(orderData),
    });

    if (!r.ok) throw new Error(`Save failed: ${await r.text()}`);
    const saved = await r.json();
    const orderId = Array.isArray(saved) ? saved[0].id : saved.id;

    if (paymentMethod === 'pay_at_event') {
      try {
        await fetch('/.netlify/functions/send-notification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'order', data: { ...orderData, pickup_pin: pin, id: orderId } }),
        });
      } catch(e) { console.warn('Notification failed:', e); }

      window.location.href = `confirmation.html?order_id=${orderId}&method=pay_at_event`;
      return;
    }

    btn.textContent = 'Redirecting to payment...';
    const sr = await fetch('/.netlify/functions/create-checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_id: orderId, items: orderData.items, customer_email: orderData.email, event_name: orderData.event_name }),
    });

    if (!sr.ok) {
      const errText = await sr.text();
      console.error('Stripe checkout error:', errText);
      throw new Error(`Checkout failed: ${errText}`);
    }
    const { url, session_id } = await sr.json();

    if (session_id) {
      await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${orderId}`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
        },
        body: JSON.stringify({ stripe_session: session_id }),
      });
    }

    window.location.href = url;

  } catch(e) {
    errorEl.textContent = e.message || 'Something went wrong. Please try again.';
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = paymentMethod === 'pay_at_event' ? 'Reserve My Order →' : 'Proceed to Payment →';
    errorEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}
</script>
