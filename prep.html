<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Prep View — Distinct. Coffee Co.</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    a, button { -webkit-tap-highlight-color: transparent; outline: none; }

    :root {
      --black: #0a0a0a;
      --white: #f8f6f2;
      --off-white: #eeebe5;
      --mid: #c8c3bb;
      --green: #2e7d32;
      --green-bg: #e8f5e9;
      --yellow: #f57f17;
      --yellow-bg: #fff8e1;
      --blue: #1565c0;
      --blue-bg: #e3f2fd;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── LOGIN ── */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--off-white);
    }
    .login-card {
      background: var(--white);
      padding: 48px 40px;
      border-radius: 4px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-logo { font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--mid); margin-bottom: 8px; }
    .login-title { font-size: 22px; font-weight: 200; margin-bottom: 32px; color: var(--black); }
    .login-input {
      width: 100%; background: var(--off-white); border: 1px solid transparent; border-radius: 2px;
      padding: 13px 16px; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 300;
      color: var(--black); outline: none; margin-bottom: 12px; text-align: center; letter-spacing: 4px;
    }
    .login-btn {
      width: 100%; background: var(--black); color: var(--white); border: none; padding: 14px;
      font-family: 'Montserrat', sans-serif; font-size: 9px; font-weight: 600; letter-spacing: 2.5px;
      text-transform: uppercase; cursor: pointer; border-radius: 2px;
    }
    .login-error { display: none; margin-top: 12px; font-size: 11px; color: #c62828; letter-spacing: 0.5px; }

    /* ── PREP VIEW ── */
    #prep-screen { display: none; min-height: 100vh; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(248,246,242,0.1);
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; }
    .back-link {
      color: rgba(248,246,242,0.5);
      text-decoration: none;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .topbar-title { font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: rgba(248,246,242,0.4); }

    /* MODE TOGGLE */
    .mode-toggle {
      display: flex;
      gap: 8px;
      padding: 16px 20px 0;
    }
    .mode-btn {
      flex: 1;
      background: rgba(248,246,242,0.06);
      border: 1px solid rgba(248,246,242,0.12);
      color: rgba(248,246,242,0.6);
      padding: 12px;
      font-family: 'Montserrat', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: var(--white);
      color: var(--black);
      border-color: var(--white);
    }

    /* QUEUE VIEW BUTTON */
    .queue-view-btn {
      flex: 1;
      background: rgba(21,101,192,0.12);
      border: 1px solid rgba(21,101,192,0.3);
      color: var(--blue);
      padding: 13px;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    /* SHRINK MODAL */
    .shrink-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 400;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .shrink-modal-overlay.open { display: flex; }
    .shrink-modal-box {
      background: var(--black);
      border-radius: 8px;
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
    }
    .shrink-modal-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .shrink-field-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(248,246,242,0.5);
      margin-bottom: 6px;
      display: block;
    }
    .shrink-field-group { margin-bottom: 16px; }
    .shrink-select, .shrink-textarea {
      width: 100%;
      background: rgba(248,246,242,0.08);
      border: 1px solid rgba(248,246,242,0.15);
      color: var(--white);
      border-radius: 4px;
      padding: 12px 14px;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
    }
    .shrink-textarea { resize: vertical; min-height: 60px; }
    .shrink-cost-preview {
      font-size: 15px;
      font-weight: 700;
      color: var(--white);
    }
    .shrink-modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .shrink-btn-cancel, .shrink-btn-save {
      flex: 1;
      padding: 13px;
      border-radius: 4px;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      border: none;
    }
    .shrink-btn-cancel { background: rgba(248,246,242,0.1); color: var(--white); }
    .shrink-btn-save { background: #d32f2f; color: white; }
    .shrink-error {
      display: none;
      font-size: 11px;
      color: #ff6b6b;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .queue-view-count {
      background: var(--blue);
      color: white;
      font-size: 10px;
      font-weight: 800;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }

    /* QUEUE VIEW OVERLAY */
    .queue-view-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 300;
      overflow-y: auto;
    }
    .queue-view-overlay.open { display: block; }
    .queue-view-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(248,246,242,0.1);
      position: sticky;
      top: 0;
      background: var(--black);
      z-index: 5;
    }
    .queue-view-close, .queue-view-refresh {
      background: none;
      border: none;
      color: rgba(248,246,242,0.6);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      padding: 6px;
    }
    .queue-view-refresh { font-size: 16px; }
    #queue-view-list { padding: 12px 20px 60px; }

    .queue-card {
      background: rgba(248,246,242,0.05);
      border: 1px solid rgba(248,246,242,0.1);
      border-left: 3px solid var(--white);
      border-radius: 4px;
      padding: 16px 18px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .queue-card:active { background: rgba(248,246,242,0.1); }
    .queue-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .queue-card-pin {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 3px;
    }
    .queue-card-position {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(248,246,242,0.35);
    }
    .queue-card-name {
      font-size: 14px;
      font-weight: 400;
      margin-bottom: 4px;
    }
    .queue-card-meta {
      font-size: 11px;
      color: rgba(248,246,242,0.45);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .queue-card-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 10px;
    }
    .queue-card-badge.paid { background: var(--green-bg); color: var(--green); }
    .queue-card-badge.reserved { background: var(--blue-bg); color: var(--blue); }
    .queue-view-empty {
      text-align: center;
      padding: 80px 24px;
      color: rgba(248,246,242,0.3);
      font-size: 13px;
    }

    /* PIN INPUT */
    .pin-search {
      padding: 20px;
      display: flex;
      gap: 10px;
    }
    .pin-search input {
      flex: 1;
      background: rgba(248,246,242,0.08);
      border: 1px solid rgba(248,246,242,0.15);
      color: var(--white);
      padding: 16px;
      font-family: 'Montserrat', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 8px;
      text-align: center;
      border-radius: 2px;
      outline: none;
    }
    .pin-search input:focus { border-color: rgba(248,246,242,0.4); }
    .pin-search input::placeholder { color: rgba(248,246,242,0.25); letter-spacing: 4px; font-size: 14px; font-weight: 400; }
    .pin-clear-btn {
      background: rgba(248,246,242,0.08);
      border: 1px solid rgba(248,246,242,0.15);
      color: var(--white);
      padding: 0 20px;
      font-size: 18px;
      border-radius: 2px;
      cursor: pointer;
    }

    /* QUEUE INDICATOR */
    .queue-indicator {
      text-align: center;
      font-size: 9px;
      color: rgba(248,246,242,0.35);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 0 20px 8px;
    }

    /* ORDER DISPLAY */
    #order-display { padding: 12px 20px 40px; }

    .empty-queue {
      text-align: center;
      padding: 80px 24px;
      color: rgba(248,246,242,0.3);
    }
    .empty-queue-icon { font-size: 40px; margin-bottom: 16px; }
    .empty-queue-text { font-size: 13px; letter-spacing: 0.5px; }

    .order-card {
      background: rgba(248,246,242,0.04);
      border: 1px solid rgba(248,246,242,0.1);
      border-radius: 6px;
      padding: 28px 24px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .order-pin-huge {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: 12px;
      text-align: center;
      margin-bottom: 4px;
      line-height: 1;
    }
    .order-pin-label {
      text-align: center;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(248,246,242,0.35);
      margin-bottom: 24px;
    }

    .order-customer-name {
      font-size: 28px;
      font-weight: 300;
      text-align: center;
      margin-bottom: 6px;
    }
    .order-meta-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 11px;
      color: rgba(248,246,242,0.5);
      letter-spacing: 0.5px;
      margin-bottom: 24px;
    }
    .order-meta-row span:not(:last-child)::after { content: '·'; margin-left: 10px; color: rgba(248,246,242,0.25); }

    .items-block {
      background: rgba(248,246,242,0.06);
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .item-line-wrap {
      border-bottom: 1px solid rgba(248,246,242,0.08);
      padding-bottom: 4px;
      margin-bottom: 4px;
    }
    .item-line-wrap:last-child { border-bottom: none; margin-bottom: 0; }
    .item-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 22px;
      font-weight: 500;
      padding: 8px 0;
    }
    .item-qty {
      font-size: 22px;
      font-weight: 800;
      color: var(--white);
      min-width: 32px;
    }

    .recipe-toggle-btn {
      background: rgba(248,246,242,0.1);
      border: 1px solid rgba(248,246,242,0.2);
      color: rgba(248,246,242,0.7);
      padding: 6px 14px;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .recipe-toggle-btn.active {
      background: var(--blue-bg);
      color: var(--blue);
      border-color: transparent;
    }

    .recipe-block {
      background: rgba(248,246,242,0.05);
      border-left: 2px solid rgba(248,246,242,0.2);
      border-radius: 0 4px 4px 0;
      padding: 10px 14px;
      margin: 0 0 10px;
    }
    .recipe-block.recipe-missing {
      font-size: 11px;
      color: var(--yellow);
      font-style: italic;
      border-left-color: var(--yellow);
    }
    .recipe-line {
      display: flex;
      gap: 10px;
      font-size: 13px;
      padding: 3px 0;
      color: rgba(248,246,242,0.75);
    }
    .recipe-line.recipe-addon {
      color: var(--yellow);
    }
    .recipe-qty {
      font-weight: 700;
      min-width: 60px;
      color: rgba(248,246,242,0.95);
    }
    .recipe-line.recipe-addon .recipe-qty { color: var(--yellow); }
    .recipe-name { flex: 1; }
    .item-name { flex: 1; margin-left: 12px; }

    .detail-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .detail-chip {
      background: rgba(248,246,242,0.08);
      border: 1px solid rgba(248,246,242,0.15);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .detail-chip.addon { background: var(--yellow-bg); color: var(--yellow); border-color: transparent; }
    .detail-chip.milk { background: var(--blue-bg); color: var(--blue); border-color: transparent; }

    .order-notes {
      background: var(--yellow-bg);
      color: #7a5200;
      padding: 14px 16px;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .order-notes strong { display: block; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px; opacity: 0.7; }

    .order-status-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 2px;
      margin-bottom: 20px;
    }
    .order-status-badge.paid { background: var(--green-bg); color: var(--green); }
    .order-status-badge.reserved { background: var(--blue-bg); color: var(--blue); }
    .order-status-badge.pending { background: var(--yellow-bg); color: var(--yellow); }

    .fulfill-btn {
      width: 100%;
      background: var(--green);
      color: white;
      border: none;
      padding: 20px;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .fulfill-btn:hover { background: #276b2c; }
    .fulfill-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      display: none;
      background: #ffebee;
      color: #c62828;
      padding: 14px 16px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 16px;
    }

    @media (max-width: 420px) {
      .order-pin-huge { font-size: 42px; letter-spacing: 8px; }
      .order-customer-name { font-size: 22px; }
      .item-line, .item-qty { font-size: 18px; }
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">Distinct. Coffee Co.</div>
      <div class="login-title">Prep View</div>
      <input type="password" class="login-input" id="password-input" placeholder="••••••••" onkeydown="if(event.key==='Enter') login()" />
      <button class="login-btn" onclick="login()">Enter</button>
      <div class="login-error" id="login-error">Incorrect password. Try again.</div>
    </div>
  </div>

  <!-- PREP SCREEN -->
  <div id="prep-screen">
    <div class="topbar">
      <div class="topbar-left">
        <a href="admin.html" class="back-link">← Admin</a>
      </div>
      <div class="topbar-title">Prep View</div>
    </div>

    <div class="mode-toggle">
      <button class="mode-btn active" id="mode-all" onclick="setMode('all')">All Unfulfilled</button>
      <button class="mode-btn" id="mode-event" onclick="setMode('event')">Today's Event</button>
    </div>

    <div class="filter-bar" style="padding:0 20px 16px;gap:10px;">
      <button class="queue-view-btn" id="queue-view-btn" onclick="openQueueView()">📋 View Queue <span id="queue-view-count" class="queue-view-count">0</span></button>
      <button class="queue-view-btn" style="background:rgba(211,47,47,0.12);border-color:rgba(211,47,47,0.3);color:#d32f2f;" onclick="openShrinkModal()">🗑️ Log Shrink</button>
    </div>

    <div class="pin-search">
      <input type="text" id="pin-input" placeholder="Enter 4-digit PIN" inputmode="numeric" maxlength="4"
             oninput="this.value=this.value.replace(/[^0-9]/g,''); if(this.value.length===4) lookupPin(this.value);" />
      <button class="pin-clear-btn" onclick="clearPin()">×</button>
    </div>

    <div class="queue-indicator" id="queue-indicator"></div>
    <div class="error-msg" id="error-msg"></div>

    <div id="order-display"></div>
  </div>

  <!-- QUEUE VIEW OVERLAY -->
  <div id="queue-view-overlay" class="queue-view-overlay">
    <div class="queue-view-topbar">
      <button class="queue-view-close" onclick="closeQueueView()">← Back to Prep</button>
      <div class="topbar-title">Queue — <span id="queue-view-mode-label">All Unfulfilled</span></div>
      <button class="queue-view-refresh" onclick="loadQueueList()">↻</button>
    </div>
    <div id="queue-view-list"></div>
  </div>

  <!-- SHRINK MODAL -->
  <div id="shrink-modal-overlay" class="shrink-modal-overlay">
    <div class="shrink-modal-box">
      <div class="shrink-modal-title">🗑️ Log Shrink</div>
      <div class="shrink-error" id="shrink-error"></div>

      <div class="shrink-field-group">
        <label class="shrink-field-label">Drink</label>
        <select class="shrink-select" id="shrink-item-select" onchange="updateShrinkCostPreview()"></select>
      </div>

      <div class="shrink-field-group">
        <label class="shrink-field-label">Reason</label>
        <select class="shrink-select" id="shrink-reason-select">
          <option>Spilled</option>
          <option>Wrong Order</option>
          <option>Customer Complaint</option>
          <option>Equipment Issue</option>
          <option>Other</option>
        </select>
      </div>

      <div class="shrink-field-group">
        <label class="shrink-field-label">Notes (optional)</label>
        <textarea class="shrink-textarea" id="shrink-notes-input" placeholder="Any extra detail..."></textarea>
      </div>

      <div class="shrink-field-group" style="margin-bottom:0;">
        <label class="shrink-field-label">Estimated Cost</label>
        <div class="shrink-cost-preview" id="shrink-cost-preview">$0.00</div>
      </div>

      <div class="shrink-modal-actions">
        <button class="shrink-btn-cancel" onclick="closeShrinkModal()">Cancel</button>
        <button class="shrink-btn-save" onclick="saveShrinkLog()">Log It</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL      = 'https://qjsitqvfimwiuoojsoge.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_edpOH0H5-T6E1A5NOjOcnw_ikl5TzTv';
    const ADMIN_PASSWORD    = 'distinct2024';

    let currentMode = 'all'; // 'all' or 'event'
    let currentOrder = null;
    let activeEventId = null;

    // ─── AUTH ────────────────────────────────────────────
    function login() {
      const pw = document.getElementById('password-input').value;
      if (pw === ADMIN_PASSWORD) {
        sessionStorage.setItem('prep_auth', 'true');
        showPrepScreen();
      } else {
        document.getElementById('login-error').style.display = 'block';
        document.getElementById('password-input').value = '';
      }
    }

    if (sessionStorage.getItem('prep_auth') === 'true') {
      showPrepScreen();
    }

    function showPrepScreen() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('prep-screen').style.display = 'block';
      init();
    }

    // ─── SUPABASE HELPER ─────────────────────────────────
    async function supaFetch(path) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
      });
      if (!res.ok) throw new Error(`Fetch failed: ${res.status}`);
      return res.json();
    }

    // orders contain customer PII and are locked down by RLS — reads/writes
    // go through the secured admin functions (service role key, server-side
    // only) instead of the public anon key used for events/menu/etc above.
    async function adminFetchOrders(queryString) {
      const res = await fetch(`/.netlify/functions/admin-get-orders${queryString ? '?' + queryString : ''}`);
      if (!res.ok) throw new Error(`admin-get-orders error: ${res.status}`);
      return res.json();
    }

    async function adminUpdateOrder(orderId, updates) {
      const res = await fetch('/.netlify/functions/admin-update-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ order_id: orderId, updates }),
      });
      return res.ok;
    }

    // ─── INIT ────────────────────────────────────────────
    async function init() {
      // Find TODAY's event specifically — must be active AND dated today,
      // not just whichever event happens to be flagged active (which could
      // be a future event still shown on the site's pre-order banner).
      try {
        const events = await supaFetch('events?is_active=eq.true&select=*');
        const todayStr = getLocalDateString(new Date());

        const todaysEvent = events.find(ev => {
          if (!ev.date_value) return false;
          return String(ev.date_value).slice(0, 10) === todayStr;
        });

        activeEventId = todaysEvent ? todaysEvent.id : null;

        // Reflect availability on the toggle itself
        const eventBtn = document.getElementById('mode-event');
        if (!activeEventId) {
          eventBtn.textContent = "Today's Event (none)";
          eventBtn.disabled = true;
          eventBtn.style.opacity = '0.4';
          eventBtn.style.cursor = 'not-allowed';
        } else {
          eventBtn.textContent = "Today's Event";
          eventBtn.disabled = false;
          eventBtn.style.opacity = '1';
          eventBtn.style.cursor = 'pointer';
        }
      } catch(e) { console.warn('Could not load today\'s event:', e); }

      loadRecipeData(); // fire and forget — populates cache for when the toggle is used
      loadNextOrder();
    }

    // Local YYYY-MM-DD, avoids UTC day-shift issues near midnight
    function getLocalDateString(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('mode-all').classList.toggle('active', mode === 'all');
      document.getElementById('mode-event').classList.toggle('active', mode === 'event');
      clearPin();
    }

    function clearPin() {
      document.getElementById('pin-input').value = '';
      document.getElementById('error-msg').style.display = 'none';
      loadNextOrder();
    }

    // ─── LOOKUP BY PIN ───────────────────────────────────
    async function lookupPin(pin) {
      const errorEl = document.getElementById('error-msg');
      errorEl.style.display = 'none';
      document.getElementById('queue-indicator').textContent = '';

      try {
        const orders = await adminFetchOrders(`pickup_pin=eq.${pin}&order=created_at.desc&limit=1`);
        if (!orders.length) {
          errorEl.textContent = `No order found with PIN ${pin}.`;
          errorEl.style.display = 'block';
          renderOrder(null);
          return;
        }
        renderOrder(orders[0]);
      } catch(e) {
        errorEl.textContent = 'Could not look up that PIN. Please try again.';
        errorEl.style.display = 'block';
      }
    }

    // ─── AUTO QUEUE (oldest unfulfilled first) ───────────
    async function loadNextOrder() {
      const indicator = document.getElementById('queue-indicator');

      if (currentMode === 'event' && !activeEventId) {
        indicator.textContent = 'No event scheduled for today';
        renderOrder(null);
        updateQueueCount(0);
        return;
      }

      try {
        let path = `status=in.(paid,reserved)&fulfilled_at=is.null&order=created_at.asc&limit=1`;
        if (currentMode === 'event' && activeEventId) {
          path = `status=in.(paid,reserved)&fulfilled_at=is.null&event_id=eq.${activeEventId}&order=created_at.asc&limit=1`;
        }

        const orders = await adminFetchOrders(path);

        // Count how many are pending overall (also drives the queue badge)
        let countPath = `status=in.(paid,reserved)&fulfilled_at=is.null&select=id`;
        if (currentMode === 'event' && activeEventId) countPath += `&event_id=eq.${activeEventId}`;
        const allPending = await adminFetchOrders(countPath);
        updateQueueCount(allPending.length);

        if (!orders.length) {
          indicator.textContent = currentMode === 'event' ? "No pending orders for today's event" : 'No pending orders in queue';
          renderOrder(null);
          return;
        }

        indicator.textContent = `Next in queue · ${allPending.length} pending`;
        renderOrder(orders[0]);

      } catch(e) {
        indicator.textContent = '';
        console.warn('Could not load queue:', e);
      }
    }

    // ─── RENDER ORDER ─────────────────────────────────────
    // ── RECIPE DATA (loaded once, cached) ──────────────────
    let allRecipeItems = null;
    let allIngredientsMap = null;
    let showRecipes = false;

    async function loadRecipeData() {
      if (allRecipeItems && allIngredientsMap) return; // already cached
      try {
        const [recipes, ingredients] = await Promise.all([
          supaFetch('recipe_items?select=*'),
          supaFetch('ingredients?select=*'),
        ]);
        allIngredientsMap = {};
        ingredients.forEach(i => allIngredientsMap[i.id] = i);

        allRecipeItems = {};
        recipes.forEach(ri => {
          if (!allRecipeItems[ri.menu_item_id]) allRecipeItems[ri.menu_item_id] = [];
          allRecipeItems[ri.menu_item_id].push(ri);
        });
      } catch(e) {
        console.warn('Could not load recipe data:', e);
        allRecipeItems = {};
        allIngredientsMap = {};
      }
    }

    function toggleRecipeView() {
      showRecipes = !showRecipes;
      renderOrder(currentOrder);
    }

    // Build the actual recipe for THIS order's item, accounting for
    // milk substitution and add-ons the customer selected.
    function buildAdjustedRecipe(itemId, drinkMilk, drinkAddons) {
      const baseRecipe = (allRecipeItems && allRecipeItems[itemId]) || [];
      if (!baseRecipe.length) return null; // no recipe defined for this item

      const milkPrefMap = {
        'Dairy':   'Whole Milk',
        'Oat':     'Oat Milk',
        'Almond':  'Almond Milk',
      };

      let lines = baseRecipe.map(ri => {
        const ing = allIngredientsMap[ri.ingredient_id];
        if (!ing) return null;
        return { name: ing.name, unit: ing.unit, qty: parseFloat(ri.quantity) };
      }).filter(Boolean);

      // Milk substitution — swap any ingredient whose name contains "Milk"
      // for whatever this specific drink's customer chose
      if (drinkMilk) {
        if (drinkMilk === 'No Milk') {
          lines = lines.filter(l => !l.name.includes('Milk'));
        } else if (milkPrefMap[drinkMilk]) {
          const targetMilk = milkPrefMap[drinkMilk];
          lines = lines.map(l => l.name.includes('Milk') ? { ...l, name: targetMilk } : l);
        } else {
          // Milk name matches an ingredient directly (e.g. custom milk options from admin)
          lines = lines.map(l => l.name.includes('Milk') ? { ...l, name: drinkMilk } : l);
        }
      }

      // Add-ons — append extra lines for what this specific drink's customer chose
      if (drinkAddons && drinkAddons.length) {
        drinkAddons.forEach(addon => {
          if (addon === 'Extra Shot') {
            lines.push({ name: 'Espresso Shot', unit: 'shot', qty: 1, isAddon: true });
          } else if (addon.includes('Syrup')) {
            lines.push({ name: addon, unit: 'pump', qty: 1, isAddon: true });
          }
        });
      }

      // Each line represents one cup — no further scaling needed since every
      // individual drink instance is now its own entry with its own recipe.
      return lines.map(l => ({ ...l, totalQty: l.qty }));
    }

    function renderOrder(order) {
      currentOrder = order;
      const container = document.getElementById('order-display');

      if (!order) {
        container.innerHTML = `
          <div class="empty-queue">
            <div class="empty-queue-icon">☕</div>
            <div class="empty-queue-text">All caught up — no orders waiting.</div>
          </div>`;
        return;
      }

      // Build a flat list of individual drinks, supporting both order.items formats:
      //  - legacy:  { menuItemId: {name, price, qty} }
      //  - current: { menuItemId: [{name, price, label, milk, addons}, ...] }
      const flatDrinks = [];
      if (order.items) {
        Object.entries(order.items).forEach(([itemId, val]) => {
          if (Array.isArray(val)) {
            val.forEach(d => flatDrinks.push({ itemId, name: d.name, label: d.label, milk: d.milk, addons: d.addons || [] }));
          } else if (val && typeof val === 'object') {
            const qty = val.qty || 1;
            for (let n = 0; n < qty; n++) {
              flatDrinks.push({ itemId, name: val.name, label: null, milk: null, addons: [] });
            }
          }
        });
      }

      const itemLines = flatDrinks.map(d => {
        let recipeHtml = '';
        if (showRecipes) {
          const recipe = buildAdjustedRecipe(d.itemId, d.milk, d.addons);
          if (recipe && recipe.length) {
            recipeHtml = `
              <div class="recipe-block">
                ${recipe.map(r => `
                  <div class="recipe-line ${r.isAddon ? 'recipe-addon' : ''}">
                    <span class="recipe-qty">${r.totalQty % 1 === 0 ? r.totalQty : r.totalQty.toFixed(2)} ${r.unit}</span>
                    <span class="recipe-name">${r.name}</span>
                  </div>
                `).join('')}
              </div>`;
          } else {
            recipeHtml = `<div class="recipe-block recipe-missing">No recipe set for this item yet</div>`;
          }
        }

        const configLine = [d.milk, ...(d.addons || [])].filter(Boolean).join(' · ');

        return `
          <div class="item-line-wrap">
            <div class="item-line">
              <span class="item-qty">${d.label ? `${d.label}` : '1×'}</span>
              <span class="item-name">${d.name}${configLine ? `<div style="font-size:12px;font-weight:400;color:rgba(248,246,242,0.5);margin-top:2px;">${configLine}</div>` : ''}</span>
            </div>
            ${recipeHtml}
          </div>`;
      }).join('');

      const chips = [];
      if (order.milk_pref) chips.push(`<span class="detail-chip milk">${order.milk_pref}</span>`);
      if (order.temp_pref) chips.push(`<span class="detail-chip milk">${order.temp_pref}</span>`);
      if (order.addons && order.addons.length) {
        order.addons.forEach(a => chips.push(`<span class="detail-chip addon">+ ${a}</span>`));
      }

      const statusLabel = order.payment_method === 'pay_at_event' ? 'reserved' : (order.status || 'paid');
      const statusText  = statusLabel === 'reserved' ? 'Pay at Pickup' : statusLabel === 'paid' ? 'Paid Online' : statusLabel;

      container.innerHTML = `
        <div class="order-card">
          <div class="order-pin-huge">${order.pickup_pin || '----'}</div>
          <div class="order-pin-label">Pickup PIN</div>

          <div class="order-customer-name">${order.customer_name || 'Guest'}</div>
          <div class="order-meta-row">
            <span>${order.pickup_time || 'No time set'}</span>
            <span>${order.event_name || ''}</span>
          </div>

          <div style="text-align:center;display:flex;gap:8px;justify-content:center;align-items:center;">
            <span class="order-status-badge ${statusLabel}">${statusText}</span>
            <button class="recipe-toggle-btn ${showRecipes ? 'active' : ''}" onclick="toggleRecipeView()">
              ${showRecipes ? '✓ Recipe View' : '📋 Show Recipe'}
            </button>
          </div>

          <div class="items-block">
            ${itemLines || '<div style="opacity:0.4;font-size:13px;">No items listed</div>'}
          </div>

          ${chips.length ? `<div class="detail-chips">${chips.join('')}</div>` : ''}

          ${order.notes ? `<div class="order-notes"><strong>Customer Notes</strong>${order.notes}</div>` : ''}

          <button class="fulfill-btn" id="fulfill-btn" onclick="markFulfilled('${order.id}')">
            ✓ Mark Fulfilled — Next Order
          </button>
        </div>`;
    }

    // ─── MARK FULFILLED ────────────────────────────────────
    async function markFulfilled(orderId) {
      const btn = document.getElementById('fulfill-btn');
      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        await adminUpdateOrder(orderId, {
          status: 'fulfilled',
          fulfilled_at: new Date().toISOString(),
        });

        // Clear PIN field and advance to next in queue automatically
        document.getElementById('pin-input').value = '';
        loadNextOrder();

      } catch(e) {
        btn.disabled = false;
        btn.textContent = '✓ Mark Fulfilled — Next Order';
        document.getElementById('error-msg').textContent = 'Could not update order. Please try again.';
        document.getElementById('error-msg').style.display = 'block';
      }
    }

    // ─── QUEUE COUNT BADGE ─────────────────────────────────
    function updateQueueCount(n) {
      const el = document.getElementById('queue-view-count');
      if (el) el.textContent = n;
    }

    // ─── FULL QUEUE VIEW ────────────────────────────────────
    function openQueueView() {
      document.getElementById('queue-view-mode-label').textContent =
        currentMode === 'event' ? "Today's Event" : 'All Unfulfilled';
      document.getElementById('queue-view-overlay').classList.add('open');
      loadQueueList();
    }

    function closeQueueView() {
      document.getElementById('queue-view-overlay').classList.remove('open');
    }

    async function loadQueueList() {
      const listEl = document.getElementById('queue-view-list');
      listEl.innerHTML = '<div class="queue-view-empty">Loading queue...</div>';

      if (currentMode === 'event' && !activeEventId) {
        listEl.innerHTML = '<div class="queue-view-empty">No event scheduled for today.</div>';
        return;
      }

      try {
        let path = `status=in.(paid,reserved)&fulfilled_at=is.null&order=created_at.asc&select=*`;
        if (currentMode === 'event' && activeEventId) {
          path += `&event_id=eq.${activeEventId}`;
        }

        const orders = await adminFetchOrders(path);
        updateQueueCount(orders.length);

        if (!orders.length) {
          listEl.innerHTML = '<div class="queue-view-empty">☕<br><br>Queue is empty — all caught up.</div>';
          return;
        }

        listEl.innerHTML = orders.map((o, idx) => {
          const itemCount = o.items ? Object.values(o.items).reduce((sum, val) => {
            return sum + (Array.isArray(val) ? val.length : (val.qty || 0));
          }, 0) : 0;

          const statusLabel = o.payment_method === 'pay_at_event' ? 'reserved' : (o.status || 'paid');
          const statusText  = statusLabel === 'reserved' ? 'Pay at Pickup' : 'Paid Online';

          return `
            <div class="queue-card" onclick="jumpToOrder('${o.id}', '${o.pickup_pin || ''}')">
              <div class="queue-card-top">
                <span class="queue-card-pin">${o.pickup_pin || '----'}</span>
                <span class="queue-card-position">#${idx + 1} in queue</span>
              </div>
              <div class="queue-card-name">${o.customer_name || 'Guest'}</div>
              <div class="queue-card-meta">
                <span class="queue-card-badge ${statusLabel}">${statusText}</span>
                <span>${itemCount} item${itemCount === 1 ? '' : 's'}</span>
                <span>${o.pickup_time || 'No time set'}</span>
              </div>
            </div>`;
        }).join('');

      } catch(e) {
        listEl.innerHTML = '<div class="queue-view-empty">Could not load queue. Please try again.</div>';
      }
    }

    // Tapping a queue card jumps straight into that order via PIN lookup,
    // same path as typing the PIN manually — keeps rendering logic in one place.
    function jumpToOrder(orderId, pin) {
      closeQueueView();
      if (pin) {
        document.getElementById('pin-input').value = pin;
        lookupPin(pin);
      }
    }

    // ─── SHRINK LOGGING ──────────────────────────────────
    let allMenuItemsForShrink = null;

    async function openShrinkModal() {
      document.getElementById('shrink-error').style.display = 'none';
      document.getElementById('shrink-notes-input').value = '';
      document.getElementById('shrink-reason-select').value = 'Spilled';

      // Make sure recipe/ingredient data is loaded so we can price the drink
      await loadRecipeData();

      if (!allMenuItemsForShrink) {
        try {
          allMenuItemsForShrink = await supaFetch('menu_items?select=id,name&order=category.asc,sort_order.asc');
        } catch (e) {
          allMenuItemsForShrink = [];
        }
      }

      const itemSel = document.getElementById('shrink-item-select');
      itemSel.innerHTML = allMenuItemsForShrink.map(i => `<option value="${i.id}">${i.name}</option>`).join('');

      updateShrinkCostPreview();
      document.getElementById('shrink-modal-overlay').classList.add('open');
    }

    function closeShrinkModal() {
      document.getElementById('shrink-modal-overlay').classList.remove('open');
    }

    function updateShrinkCostPreview() {
      const itemId = document.getElementById('shrink-item-select').value;
      const recipe = (allRecipeItems && allRecipeItems[itemId]) || [];
      let cost = 0;
      recipe.forEach(ri => {
        const ing = allIngredientsMap ? allIngredientsMap[ri.ingredient_id] : null;
        if (!ing) return;
        cost += ing.cost_cents * parseFloat(ri.quantity);
      });
      document.getElementById('shrink-cost-preview').textContent = `$${(cost/100).toFixed(2)}`;
    }

    async function saveShrinkLog() {
      const errorEl = document.getElementById('shrink-error');
      errorEl.style.display = 'none';

      const itemSel = document.getElementById('shrink-item-select');
      const itemId = itemSel.value;
      const itemName = itemSel.options[itemSel.selectedIndex]?.textContent || '';
      const reason = document.getElementById('shrink-reason-select').value;
      const notes = document.getElementById('shrink-notes-input').value.trim();

      if (!itemId) { errorEl.textContent = 'Please select a drink.'; errorEl.style.display = 'block'; return; }

      const recipe = (allRecipeItems && allRecipeItems[itemId]) || [];
      let costCents = 0;
      recipe.forEach(ri => {
        const ing = allIngredientsMap ? allIngredientsMap[ri.ingredient_id] : null;
        if (!ing) return;
        costCents += ing.cost_cents * parseFloat(ri.quantity);
      });

      // Auto-associates with today's active event, if there is one — same
      // event context Prep View is already working within.
      let eventName = null;
      if (activeEventId) {
        try {
          const [ev] = await supaFetch(`events?id=eq.${activeEventId}&select=name`);
          eventName = ev ? ev.name : null;
        } catch (e) { /* not critical — log without event context if this fails */ }
      }

      try {
        const res = await fetch('/.netlify/functions/admin-shrink', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            data: {
              menu_item_id: itemId,
              menu_item_name: itemName,
              event_id: activeEventId || null,
              event_name: eventName,
              reason,
              cost_cents: costCents,
              notes: notes || null,
            },
          }),
        });
        if (!res.ok) throw new Error(await res.text());
        closeShrinkModal();
      } catch (e) {
        errorEl.textContent = `Could not log shrink: ${e.message}`;
        errorEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
