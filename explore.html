<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Explore the Cart — Distinct. Coffee Co.</title>
  <link rel="manifest" href="/manifest-home.json?v=2" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="Step up to the Distinct. Coffee Co. cart. Look around, browse the menu and meet the team in an interactive 3D scene." />
  <meta property="og:title" content="Explore the Cart — Distinct. Coffee Co." />

  <style>
    html, body { margin: 0; height: 100%; background: #0a0a0a; overflow: hidden; overscroll-behavior: none; }
    .noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 30px; background: #f8f6f2; font-family: 'Montserrat', sans-serif; color: #444; }
    .noscript a { color: #0a0a0a; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <noscript><div class="noscript"><p>The interactive 3D cart needs JavaScript. <a href="/">Head back to the main site</a> to see the menu and order.</p></div></noscript>

  <script type="module">
    import { SceneEngine } from './scene-engine/engine.js';
    import scene from './scene-engine/scenes/distinct-coffee.js';
    new SceneEngine(document.getElementById('stage'), scene).start();
  </script>
</body>
</html>
